name: pytest

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: wrap-ew2

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
